on:
  workflow_dispatch: {}
  pull_request: {}
  # Sin filtro `paths`: el repo commitea directo a master, así que
  # cada push de código tiene que pasar por Semgrep, no solo los que
  # tocan este workflow. Antes la cobertura efectiva era el schedule
  # nocturno + manual (ver SECURITY.md §8).
  push:
    branches:
    - main
    - master
  schedule:
  # random HH:MM to avoid a load spike on GitHub Actions at 00:00
  - cron: 26 22 * * *
name: Semgrep
jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      # Fijada por digest, por lo mismo que checkout: `semgrep/semgrep`
      # a secas es `latest`, que cambia con cada versión y lo puede
      # repuntar quien publica la imagen. El digest es el del índice
      # multiarquitectura de 1.183.0 (el que tenía `latest` el
      # 2026-11-08, según la API de Docker Hub). Subir de versión =
      # cambiar tag y digest a conciencia (SECURITY.md §8).
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
    # Fijado por SHA: una etiqueta (`@v6`) la puede repuntar el dueño
    # de la acción en silencio -cadena de suministro-. Subir de
    # versión = cambiar este SHA a conciencia.
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - run: semgrep ci
